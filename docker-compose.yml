services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: noc-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - noc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: noc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - TZ=Europe/Moscow
    restart: always
    networks:
      - noc-net

networks:
  noc-net:
    driver: bridge