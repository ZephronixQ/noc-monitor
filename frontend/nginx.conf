# ==============================================================================
# ЗОНЫ RATE LIMITING (ЗАЩИТА ОТ BRUTE-FORCE И DDOS НА БЕЛОМ IP)
# ==============================================================================
# 1. Жёсткий лимит на попытки авторизации (не более 5 запросов в минуту с одного IP)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 2. Лимит на админку Django (не более 3 запросов в секунду)
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=3r/s;

# 3. Общий лимит на API телеметрии
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Скрываем версию Nginx от сканеров безопасности
    server_tokens off;

    # Максимальный размер загружаемых файлов (для CSV / импортов)
    client_max_body_size 20M;

    # ==============================================================================
    # БОЕВЫЕ ЗАГОЛОВКИ БЕЗОПАСНОСТИ (OWASP STANDARD)
    # ==============================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==============================================================================
    # ФРОНТЕНД (SVELTE SPA)
    # ==============================================================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Кэширование статики фронтенда (JS/CSS/SVG)
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # ==============================================================================
    # ЗАЩИТА АВТОРИЗАЦИИ (/api/auth/login) ОТ ПЕРЕБОРА ПАРОЛЕЙ
    # ==============================================================================
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================================
    # ОБЩИЙ API БЭКЕНДА
    # ==============================================================================
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ==============================================================================
    # ВЕЧНЫЙ WEBSOCKET ТЕЛЕМЕТРИИ (БЕЗ ОБРЫВОВ СОЕДИНЕНИЯ)
    # ==============================================================================
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Тайм-аут 7 дней: сокет не отвалится сам по себе
        proxy_read_timeout 604800s;
        proxy_send_timeout 604800s;
        proxy_buffering off;
    }

    # ==============================================================================
    # ПАНЕЛЬ УПРАВЛЕНИЯ DJANGO ADMIN (/admin)
    # ==============================================================================
    location /admin {
        limit_req zone=admin_limit burst=10 nodelay;

        proxy_pass http://backend:8000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Стили и скрипты админки Django (CSS/JS/Fonts)
    location /static/admin/ {
        proxy_pass http://backend:8000/static/admin/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}